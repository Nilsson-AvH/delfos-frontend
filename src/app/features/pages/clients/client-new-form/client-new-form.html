<form [formGroup]="formData" (ngSubmit)="onSubmit()">
    <div class="header-formData">
        <h1>
            ✏️ Create New Client
        </h1>
    </div>

    <fieldset>
        <legend>Basic Information</legend>

        <div class="field">
            <label for="companyName">Company Name:</label>
            <input type="text" id="companyName" formControlName="companyName">
        </div>

        <div class="field">
            <label for="nit">NIT:</label>
            <input type="text" id="nit" formControlName="nit">
        </div>

        <div class="field">
            <label for="address">Address:</label>
            <input type="text" id="address" formControlName="address">
        </div>

        <div class="field">
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" formControlName="phone">
        </div>

        <div class="field">
            <label for="companyEmail">Company Email:</label>
            <input type="email" id="companyEmail" formControlName="companyEmail">
        </div>

        <div class="field">
            <label for="clientManager">Client Manager:</label>
            <!-- Implementar select con los usuarios -->
            <!-- <input type="text" id="clientManager" formControlName="clientManager"> -->
            <select formControlName="clientManager" id="clientManager">
                <option value="">Select Client Manager</option>
                @for (user of clientManager | async; track user.id) {
                <option [value]="user.id">{{ user.fullName }}</option>
                }
            </select>
        </div>
    </fieldset>

    <div class="field buttons">
        <button class="register" type="submit" [disabled]="formData.invalid">Create Client</button>
        <button class="reset" type="button" (click)="onReset()">Reset</button>
    </div>

</form>
